name: Desplegar en GitHub Pages

# Mismo nombre y misma forma que en la-mesa, para que los dos proyectos se
# publiquen igual. La diferencia es que aquí sí hace falta un paso de
# construcción: este repo no sube archivos estáticos ya exportados, sube
# fuente que Vite tiene que compilar. Por eso "verificar" (contraste +
# pruebas de pedido + build) corre en el mismo job, antes de subir nada — si
# alguna de las 66 pruebas automáticas falla, el job se detiene ahí y nunca
# llega a desplegar un sitio roto.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Verificar (contraste + pedido + build)
        run: npm run verificar
        env:
          # La llave `anon` está pensada para viajar en el navegador —no da
          # más permisos que los que ya conceden las políticas RLS—, así que
          # puede vivir en un *secret* de Actions sin que eso sea gracioso:
          # es sólo para no dejarla también escrita en el repo en texto
          # plano. Se configuran en Settings → Secrets and variables →
          # Actions, con los mismos nombres que en `.env.example`.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Subir el sitio como artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
