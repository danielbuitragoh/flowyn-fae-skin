name: Publicar en GitHub Pages

# Se publica sólo después de que "Verificar" corra en el mismo commit y
# termine bien. Publicar un sitio que no pasó las 66 pruebas automáticas
# —contraste, cálculo de pedido, datos de envío— sería peor que no publicar
# nada: se vería en producción el mismo día que se rompiera.
on:
  workflow_run:
    workflows: ["Verificar"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Sólo un despliegue a la vez; uno nuevo cancela al anterior si sigue en
# cola, para no publicar dos commits fuera de orden.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # La llave `anon` está pensada para viajar en el navegador —no da
          # más permisos que los que ya conceden las políticas RLS—, así que
          # puede vivir en un *secret* de Actions sin que eso sea gracioso:
          # es sólo para no dejarla también escrita en el repo en texto
          # plano. Se configuran en Settings → Secrets and variables →
          # Actions, con los mismos nombres que en `.env.example`.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: publicacion
        uses: actions/deploy-pages@v4
